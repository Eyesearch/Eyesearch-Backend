# Production stack for the GCP VM.
#
# PostgreSQL is already running on this VM and listens on 127.0.0.1 only, which
# is the secure default. `network_mode: host` puts the container in the VM's own
# network namespace so `127.0.0.1:5432` means the database, and nothing has to be
# exposed on the public interface. The trade-off is that `ports:` is ignored —
# uvicorn binds port 8000 on the host directly, which is what we want anyway.
#
# The alternative, if you would rather not use host networking, is the commented
# bridge block below; it needs PostgreSQL to listen on the docker bridge too.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: eyesearch-backend:latest
    container_name: eyesearch-backend
    restart: unless-stopped
    network_mode: host

    env_file:
      - .env
    environment:
      # Explicit here rather than relying on .env, because these decide whether
      # the process crawls and whether it will accept a local database.
      ENVIRONMENT: production
      PORT: "8000"
      # Inside the VM's network namespace this is the local PostgreSQL.
      DATABASE_URL: postgresql://eyesearch:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@127.0.0.1:5432/eyesearch
      ALLOW_LOCAL_DB: "false"
      # Set to "false" to run the API only, with no crawling at all.
      CRAWLER_ENABLED: "${CRAWLER_ENABLED:-true}"
      # Repair mode: pause fresh discovery and drain the legacy backlog first.
      CRAWLER_DRAIN_MODE: "${CRAWLER_DRAIN_MODE:-false}"
      REVALIDATION_ENABLED: "${REVALIDATION_ENABLED:-true}"

      # The VM this runs on has one vCPU and under a gigabyte of RAM, and the
      # crawler shares it with the search API. These are the values that box was
      # tuned to: they live here rather than in someone's .env so a fresh clone
      # and a redeploy start correct instead of rediscovering the same limits.
      # Every one is still overridable from .env.
      CRAWL_BATCH_SIZE: "${CRAWL_BATCH_SIZE:-30}"
      CRAWL_CONCURRENCY: "${CRAWL_CONCURRENCY:-3}"
      CRAWL_TIMEOUT_SECONDS: "${CRAWL_TIMEOUT_SECONDS:-15}"
      CRAWL_CONNECT_TIMEOUT_SECONDS: "${CRAWL_CONNECT_TIMEOUT_SECONDS:-8}"
      CRAWL_READ_TIMEOUT_SECONDS: "${CRAWL_READ_TIMEOUT_SECONDS:-12}"
      # 4 s was tight enough that the queue repair and pending_batch() were
      # cancelled mid-statement under crawl load, which stopped the crawl.
      DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-20000}"
      # A search that needs longer than this is slow, not broken: answer it.
      SEARCH_STATEMENT_TIMEOUT_MS: "${SEARCH_STATEMENT_TIMEOUT_MS:-6000}"
      # India only. The global ring is the largest spider-trap surface there is.
      ALLOW_GLOBAL_DOMAINS: "${ALLOW_GLOBAL_DOMAINS:-false}"
      # 24 h benched a domain for a burst of timeouts; an hour is enough.
      CRAWL_BREAKER_COOLDOWN_SECONDS: "${CRAWL_BREAKER_COOLDOWN_SECONDS:-3600}"
      # Freshness re-arms outranked never-fetched URLs and starved them.
      REARM_COOLDOWN_SECONDS: "${REARM_COOLDOWN_SECONDS:-2592000}"

    # Cap the log growth: the crawler is chatty and this VM's disk is also
    # holding the database.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    # The parser handles untrusted HTML; a runaway page should not be able to
    # exhaust the VM.
    mem_limit: 1500m
    cpus: "1.5"

    healthcheck:
      # Probes the IPv6 loopback, because that is what uvicorn binds. Asking
      # 127.0.0.1 works through the IPv4-mapped socket on most hosts, but a
      # healthcheck that depends on a mapping is a healthcheck that lies once.
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://[::1]:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  # --- Bridge alternative ---------------------------------------------------
  # Uncomment this instead of `network_mode: host`, and in .env point
  # DATABASE_URL at host.docker.internal. PostgreSQL must then accept
  # connections from the docker bridge:
  #   postgresql.conf: listen_addresses = 'localhost,172.17.0.1'
  #   pg_hba.conf:     host all all 172.17.0.0/16 scram-sha-256
  #
  # backend:
  #   build: .
  #   restart: unless-stopped
  #   env_file: [.env]
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   ports:
  #     - "127.0.0.1:8000:8000"
